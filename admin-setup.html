<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>تعيين كلمة المرور | أفق</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4e9;color:#292019;font:15px/1.7 Tahoma,Arial,sans-serif}main{max-width:440px;margin:8vh auto;background:#fff;border:1px solid #efdfd1;border-radius:20px;padding:28px;box-shadow:0 12px 40px #582b1014}h1{font-size:24px}label{display:block;font-weight:bold;margin:14px 0 5px}input,button{font:inherit;width:100%;border-radius:9px;padding:12px}input{border:1px solid #decbbd}button{background:#c4470b;color:white;border:0;font-weight:bold;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}a{color:#c4470b}#status{color:#9c380b}small{color:#6b5b50}[hidden]{display:none!important}@media(max-width:500px){main{margin:25px 14px}}</style></head><body><main><strong style="color:#c4470b">أفق | إدارة المنصة</strong><h1>تعيين كلمة المرور</h1><p id="status" role="status" aria-live="polite">جاري التحقق من رابط الدعوة...</p><form id="form" hidden><p id="email" dir="ltr"></p><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="12" required dir="ltr"><small>استخدم 12 حرفًا أو أكثر.</small><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required dir="ltr"><button id="save">حفظ كلمة المرور</button></form><p><a href="admin.html">العودة إلى تسجيل الدخول</a></p></main><script>
'use strict';const base='https://mlyoatcbpkbqbcgugrgp.supabase.co',key="sb_publishable_PCvjbbXhYa0LP9Efqpujzg_G_Mpf-4D",$=id=>document.getElementById(id);const fragment=new URLSearchParams(location.hash.slice(1));let token=fragment.get('access_token');const type=fragment.get('type');history.replaceState(null,'',location.pathname);const status=m=>$('status').textContent=m;async function request(path,method,body){const headers={apikey:key,Authorization:'Bearer '+token};if(body)headers['Content-Type']='application/json';const r=await fetch(base+'/auth/v1/'+path,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error('تعذر إتمام العملية. تحقق من صلاحية الرابط أو اطلب دعوة جديدة.');return r.json()}async function init(){if(!token||!['invite','recovery'].includes(type)){token=null;status('افتح رابط الدعوة أو استعادة كلمة المرور المرسل إلى بريدك.');return}try{const user=await request('user','GET');if(!user.email_confirmed_at){token=null;status('يجب تأكيد البريد الإلكتروني أولاً.');return}$('email').textContent=user.email;$('form').hidden=false;status('تم التحقق. اختر كلمة مرور قوية.')}catch(e){token=null;status(e.message)}}$('form').onsubmit=async e=>{e.preventDefault();if(!token)return;const pass=$('password').value;if(pass!==$('confirm').value){status('كلمتا المرور غير متطابقتين.');return}$('save').disabled=true;try{await request('user','PUT',{password:pass});$('form').hidden=true;token=null;status('تم حفظ كلمة المرور. يمكنك الآن العودة إلى صفحة الدخول.')}catch(e){status(e.message)}finally{$('password').value='';$('confirm').value='';$('save').disabled=false}};init();
</script></body></html>
